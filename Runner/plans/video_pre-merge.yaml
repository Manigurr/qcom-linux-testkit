metadata:
  format: Lava-Test Test Definition 1.0
  name: Video_V4L2_LocalClips
  description: "Run Video V4L2 runner with local clips tar and custom .ko dir; test downstream boot & module loading, then upstream; supports lemans/monaco/kodiak/glymur"
  maintainer:
    - smuppand@qti.qualcomm.com
  os:
    - openembedded
  scope:
    - functional
run:
  steps:
    - cd Runner
     - export REPO_ROOT="$PWD"
     - export TARGET="${TARGET:-}" # kodiak | lemans | monaco | glymur (case-insensitive)

    - |
      RPATH="$REPO_ROOT/suites/Multimedia/Video/Video_V4L2_Runner/run.sh"
      RESFILE="$REPO_ROOT/suites/Multimedia/Video/Video_V4L2_Runner/Video_V4L2_Runner.res"

      # Custom media bundle (local) path
      CLIPS_TAR="/data/vendor/iris_test_app/video_clips_iris.tar.gz"

      # Custom downstream module location (directory containing iris_vpu.ko)
      KO_DIR="/data/vendor/iris_test_app"

      # Optional: downstream firmware needed on Kodiak overlay
      DS_FW="/data/vendor/iris_test_app/vpu20_1v.mbn"

       # Prefer explicit TARGET; otherwise derive from LAVA device-type
       if [ -n "${TARGET:-}" ]; then
         TL="$(printf '%s' "$TARGET" | tr '[:upper:]' '[:lower:]')"
       else
         DEVTYPE_RAW="${DEVICE_TYPE:-${LAVA_DEVICE_TYPE:-${LAVA_DEVICE_TYPE_NAME:-${DEVICE_TYPE_NAME:-}}}}"
         DEVTYPE="$(printf '%s' "$DEVTYPE_RAW" | tr '[:upper:]' '[:lower:]')"
         case "$DEVTYPE" in
           # monaco
           qcs8300-ride|qcs8300-ride-sx|iq-8275-evk) TL="monaco" ;;
           # lemans
           qcs9100-ride-r3|sa8775p-ride|iq-9075-evk|qcs9075-rb8|qcs9100-ride-sx) TL="lemans" ;;
           # kodiak
           qcs6490-rb3gen2|rb3gen2|qcs6490-rb3gen2-core-kit) TL="kodiak" ;;
           # glymur (sm8750)
           *glymur*|*sm8750*) TL="glymur" ;;
           # pakala (sm8750) - upstream only
           *pakala*) TL="pakala" ;;
           # hamoa
           hamoa|iq-x7181-evk|iq-x7181) TL="hamoa" ;;
           # purwa
           purwa|iq-x5121-evk|iq-x5121) TL="purwa" ;;
           # fallback to autodetect in run.sh
           *) TL="" ;;
         esac
       fi

      case "$TL" in
        kodiak|lemans|monaco|pakala|shikra|talos|glymur|purwa|hamoa) PLAT="--platform $TL" ;;
        *) PLAT="" ;; # autodetect
      esac

      echo "DEBUG: TARGET='${TARGET:-}' DEVTYPE='${DEVTYPE:-}' -> TL='$TL' PLAT='$PLAT'"

      # Common args (local clips; no Wi-Fi/TAR_URL needed)
      ARGS_COMMON="--clips-tar $CLIPS_TAR --app /data/vendor/iris_test_app/iris_v4l2_test $PLAT --retry-on-fail 2 --loglevel 15"

      # --- BASE (upstream): NO ko args here ---
      ARGS_BASE="--stack base $ARGS_COMMON"

      # --- OVERLAY (downstream): add ko args; only add FW on kodiak ---
      ARGS_OVERLAY="--stack overlay $ARGS_COMMON"
      if [ "$TL" = "kodiak" ]; then
        ARGS_OVERLAY="$ARGS_OVERLAY --downstream-fw $DS_FW"
      fi

       echo "BASE ARGS: $ARGS_BASE"
       echo "OVERLAY ARGS: $ARGS_OVERLAY"

       # Detect actual platform if TL is empty (auto-detect case)
       if [ -z "$TL" ]; then
         # Source the lib_video.sh to get platform detection
         if [ -f "$REPO_ROOT/utils/lib_video.sh" ]; then
           . "$REPO_ROOT/utils/lib_video.sh"
           TL="$(video_detect_platform)"
           echo "INFO: Auto-detected platform: $TL"
         fi
       fi

       # ========== PHASE 1: DOWNSTREAM TESTING ==========
       # Test downstream (iris_vpu) first, verify module loading and boot
       echo "=========================================="
       echo "PHASE 1: DOWNSTREAM TESTING"
       echo "Platform: $TL"
       echo "=========================================="

       # Check if platform supports downstream testing
       case "$TL" in
         pakala|shikra|talos|purwa|hamoa)
           echo "INFO: Platform $TL does not support downstream/overlay testing - skipping downstream phase"
           ;;
         lemans|kodiak|monaco|glymur)
           echo "INFO: Platform $TL supports downstream testing - proceeding with overlay/downstream phase"
           
           # Pre-test: Verify boot and module state
           echo "PRE-TEST: Verifying downstream boot and module state..."
           echo "Current kernel: $(uname -r)"
           echo "Current modules:"
           lsmod | grep -E "iris_vpu|qcom_iris|venus" || echo "  (no video modules currently loaded)"
           
           # Run OVERLAY (downstream)
           # shellcheck disable=SC2086
           sh -lc "$RPATH $ARGS_OVERLAY" || true
           "$REPO_ROOT/utils/send-to-lava.sh" "$RESFILE" || true
           
           # Post-test: Verify module loading
           echo "POST-TEST: Verifying downstream module loading..."
           if lsmod | grep -q iris_vpu; then
             echo "SUCCESS: iris_vpu module loaded"
           else
             echo "WARNING: iris_vpu module not loaded after downstream test"
           fi
           
           if lsmod | grep -q qcom_iris; then
             echo "WARNING: qcom_iris still loaded (should be unloaded for downstream)"
           else
             echo "SUCCESS: qcom_iris not loaded (expected for downstream)"
           fi
           ;;
         *)
           echo "INFO: Platform $TL - attempting downstream testing"
           # shellcheck disable=SC2086
           sh -lc "$RPATH $ARGS_OVERLAY" || true
           "$REPO_ROOT/utils/send-to-lava.sh" "$RESFILE" || true
           ;;
       esac

       # ========== PHASE 2: UPSTREAM TESTING ==========
       # Test upstream (qcom_iris) after downstream, verify module switching
       echo ""
       echo "=========================================="
       echo "PHASE 2: UPSTREAM TESTING"
       echo "Platform: $TL"
       echo "=========================================="

       case "$TL" in
         pakala|shikra|talos|purwa|hamoa)
           echo "INFO: Platform $TL - upstream only (no downstream phase)"
           ;;
         lemans|kodiak|monaco|glymur)
           echo "INFO: Platform $TL - switching from downstream to upstream"
           
           # Pre-test: Verify current module state before switch
           echo "PRE-TEST: Verifying module state before upstream switch..."
           echo "Current modules:"
           lsmod | grep -E "iris_vpu|qcom_iris|venus" || echo "  (no video modules currently loaded)"
           ;;
       esac

       # Run BASE (upstream)
       # shellcheck disable=SC2086
       sh -lc "$RPATH $ARGS_BASE" || true
       "$REPO_ROOT/utils/send-to-lava.sh" "$RESFILE" || true

       # Post-test: Verify upstream module loading
       echo "POST-TEST: Verifying upstream module loading..."
       case "$TL" in
         lemans|monaco)
           if lsmod | grep -q qcom_iris; then
             echo "SUCCESS: qcom_iris module loaded"
           else
             echo "WARNING: qcom_iris module not loaded after upstream test"
           fi
           if lsmod | grep -q iris_vpu; then
             echo "WARNING: iris_vpu still loaded (should be unloaded for upstream)"
           else
             echo "SUCCESS: iris_vpu not loaded (expected for upstream)"
           fi
           ;;
         kodiak)
           if lsmod | grep -q qcom_iris; then
             echo "SUCCESS: qcom_iris module loaded"
           else
             echo "WARNING: qcom_iris module not loaded after upstream test"
           fi
           if lsmod | grep -q iris_vpu; then
             echo "WARNING: iris_vpu still loaded (should be unloaded for upstream on kodiak)"
           else
             echo "SUCCESS: iris_vpu not loaded (expected for upstream on kodiak)"
           fi
           ;;
         glymur)
           echo "INFO: Verifying upstream module state for glymur"
           lsmod | grep -E "iris_vpu|qcom_iris|venus" || echo "  (checking module state)"
           ;;
       esac

       # Optional roll-up (ignored if absent)
       "$REPO_ROOT/utils/result_parse.sh" || true
