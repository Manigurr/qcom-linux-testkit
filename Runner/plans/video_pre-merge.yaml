metadata:
  format: Lava-Test Test Definition 1.0
  name: Video_V4L2_LocalClips
  description: "Run Video V4L2 runner with local clips tar and custom .ko dir; auto-args for kodiak vs lemans/monaco; run downstream then upstream"
  maintainer:
    - smuppand@qti.qualcomm.com
  os:
    - openembedded
  scope:
    - functional
run:
  steps:
    - cd Runner
    - export REPO_ROOT="$PWD"
    - export TARGET="${TARGET:-}" # kodiak | lemans | monaco (case-insensitive)
    - |
      set -u

      RPATH="$REPO_ROOT/suites/Multimedia/Video/Video_V4L2_Runner/run.sh"
      RESFILE="$REPO_ROOT/suites/Multimedia/Video/Video_V4L2_Runner/Video_V4L2_Runner.res"

      # Custom media bundle (local) path
      CLIPS_TAR="/data/vendor/iris_test_app/video_clips_iris.tar.gz"
      # Custom downstream module location (directory containing iris_vpu.ko)
      KO_DIR="/data/vendor/iris_test_app"
      # Optional: downstream firmware needed on Kodiak overlay
      DS_FW="/data/vendor/iris_test_app/vpu20_1v.mbn"

      # Prefer explicit TARGET; otherwise derive from LAVA device-type.
      if [ -n "${TARGET:-}" ]; then
        TL="$(printf '%s' "$TARGET" | tr '[:upper:]' '[:lower:]')"
      else
        DEVTYPE_RAW="${DEVICE_TYPE:-${LAVA_DEVICE_TYPE:-${LAVA_DEVICE_TYPE_NAME:-${DEVICE_TYPE_NAME:-}}}}"
        DEVTYPE="$(printf '%s' "$DEVTYPE_RAW" | tr '[:upper:]' '[:lower:]')"
        case "$DEVTYPE" in
          qcs8300-ride|qcs8300-ride-sx|iq-8275-evk) TL="monaco" ;;
          qcs9100-ride-r3|sa8775p-ride|iq-9075-evk|qcs9075-rb8|qcs9100-ride-sx) TL="lemans" ;;
          qcs6490-rb3gen2|rb3gen2|qcs6490-rb3gen2-core-kit) TL="kodiak" ;;
          *pakala*|*sm8750*) TL="pakala" ;;
          hamoa|iq-x7181-evk|iq-x7181) TL="hamoa" ;;
          purwa|iq-x5121-evk|iq-x5121) TL="purwa" ;;
          shikra|*shikra*) TL="shikra" ;;
          *) TL="" ;;
        esac
      fi

      # Detect the actual platform before constructing stack arguments.
      if [ -z "$TL" ] && [ -f "$REPO_ROOT/utils/lib_video.sh" ]; then
        # shellcheck disable=SC1091
        . "$REPO_ROOT/utils/lib_video.sh"
        TL="$(video_detect_platform)"
        echo "INFO: Auto-detected platform: $TL"
      fi

      case "$TL" in
        kodiak|lemans|monaco|pakala|shikra|talos|glymur|purwa|hamoa)
          PLAT="--platform $TL" ;;
        *)
          PLAT=""
          ;;
      esac

      echo "DEBUG: TARGET='${TARGET:-}' DEVTYPE='${DEVTYPE:-}' -> TL='$TL' PLAT='$PLAT'"

      # The imported suite is skipped only for these platforms.
      SKIP_VIDEO_SUITE=0
      case "$TL" in
        purwa|hamoa|shikra)
          SKIP_VIDEO_SUITE=1
          echo "INFO: Skipping video-test-suite for platform: $TL"
          ;;
      esac

      VIDEO_SUITE_ROOT="/opt/qcom-linux-testkit/video-test"
      VIDEO_SUITE_REPO="https://github.com/Manigurr/qcom-linux-testkit.git"
      VIDEO_SUITE_BRANCH="video-test-suite-import"
      VIDEO_SUITE_LOG_ROOT="/opt/qcom-linux-test/video-test-suite-results"

      clone_video_suite()
      {
        [ "$SKIP_VIDEO_SUITE" -eq 1 ] && return 0

        echo "=== Cloning video-test-suite ==="
        mkdir -p "$(dirname "$VIDEO_SUITE_ROOT")"
        rm -rf "$VIDEO_SUITE_ROOT"

        clone_rc=1
        for attempt in 1 2 3; do
          echo "video-test-suite clone attempt ${attempt}/3"
          if git clone \
              --depth 1 \
              --single-branch \
              --branch "$VIDEO_SUITE_BRANCH" \
              "$VIDEO_SUITE_REPO" \
              "$VIDEO_SUITE_ROOT"; then
            clone_rc=0
            break
          fi
          rm -rf "$VIDEO_SUITE_ROOT"
          sleep 5
        done

        if [ "$clone_rc" -ne 0 ]; then
          echo "ERROR: Failed to clone video-test-suite"
          return 1
        fi

        if [ ! -f "$VIDEO_SUITE_ROOT/run.sh" ]; then
          echo "ERROR: video-test-suite run.sh was not found"
          return 1
        fi

        chmod +x "$VIDEO_SUITE_ROOT/run.sh"
        echo "video-test-suite commit:"
        git -C "$VIDEO_SUITE_ROOT" log -1 --oneline || true
      }

      run_video_suite()
      {
        STACK_NAME="$1"
        [ "$SKIP_VIDEO_SUITE" -eq 1 ] && return 0

        mkdir -p "$VIDEO_SUITE_LOG_ROOT"
        LOG_FILE="$VIDEO_SUITE_LOG_ROOT/video-suite-${STACK_NAME}.log"

        echo "=== Running video-test-suite after ${STACK_NAME} testcases ==="
        echo "Command: ./run.sh iris_v4l2_test"

        cd "$VIDEO_SUITE_ROOT" || return 1
        set +e
        ./run.sh iris_v4l2_test >"$LOG_FILE" 2>&1
        suite_rc="$?"
        cat "$LOG_FILE"
        set -e

        echo "video-test-suite ${STACK_NAME} exit status: ${suite_rc}"
        return "$suite_rc"
      }

      # Clone once and reuse the same checkout after downstream and upstream runs.
      clone_video_suite || exit $?

      ARGS_COMMON="--clips-tar $CLIPS_TAR --app /data/vendor/iris_test_app/iris_v4l2_test $PLAT --retry-on-fail 2 --loglevel 15"
      ARGS_OVERLAY="--stack overlay $ARGS_COMMON --ko-dir $KO_DIR --ko-prefer-custom"
      ARGS_BASE="--stack base $ARGS_COMMON"

      echo "OVERLAY (downstream) ARGS: $ARGS_OVERLAY"
      echo "BASE (upstream) ARGS: $ARGS_BASE"

      case "$TL" in
        kodiak|glymur|lemans|monaco)
          echo "=== Running downstream video_pre-merge testcases ==="
          # shellcheck disable=SC2086
          sh -lc "$RPATH $ARGS_OVERLAY" || true
          "$REPO_ROOT/utils/send-to-lava.sh" "$RESFILE" || true

          # Run the imported suite immediately after downstream testcases.
          run_video_suite "downstream" || exit $?
          ;;
        *)
          echo "INFO: Platform $TL is upstream-only; skipping downstream pass"
          ;;
      esac

      echo "=== Running upstream video_pre-merge testcases ==="
      # Talos uses boot-loaded Venus modules. run.sh validates them without
      # unloading/loading qcom_iris or changing the stack.
      # shellcheck disable=SC2086
      sh -lc "$RPATH $ARGS_BASE" || true
      "$REPO_ROOT/utils/send-to-lava.sh" "$RESFILE" || true

      # Run the imported suite immediately after upstream testcases.
      run_video_suite "upstream" || exit $?

      # Optional roll-up (ignored if absent).
      "$REPO_ROOT/utils/result_parse.sh" || true
