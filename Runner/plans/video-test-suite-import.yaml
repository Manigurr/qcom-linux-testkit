metadata:
  format: Lava-Test Test Definition 1.0
  name: Video_Test_Suite_Import
  description: "Check Git, network, and system time; clone qcom-linux-testkit and run the video test suite"
  maintainer:
    - manigurr@qti.qualcomm.com
  os:
    - openembedded
  scope:
    - functional

run:
  steps:
    - mkdir -p /opt/qcom-linux-testkit && cd /opt/qcom-linux-testkit

    - |
      set -u

      echo "=== Initial Network Status ==="

      if command -v hostname >/dev/null 2>&1; then
        hostname || true
      fi

      if command -v ip >/dev/null 2>&1; then
        echo "--- Network interfaces ---"
        ip addr || true

        echo "--- Default route ---"
        ip route show default || true
      else
        echo "ERROR: ip command is not available; cannot verify network readiness"
        exit 1
      fi

      echo "=== Wi-Fi Status ==="

      if command -v nmcli >/dev/null 2>&1; then
        nmcli device status || true

        if LC_ALL=C nmcli --terse --fields TYPE,STATE device status 2>/dev/null |
          awk -F: '$1 == "wifi" && $2 == "connected" { found=1 } END { exit !found }'; then
          echo "RESULT: A Wi-Fi device is connected"
        else
          echo "RESULT: No connected Wi-Fi device detected"
        fi
      elif command -v iw >/dev/null 2>&1; then
        WIFI_CONNECTED=0
        WIFI_INTERFACES="$(iw dev 2>/dev/null | awk '$1 == "Interface" { print $2 }')"

        if [ -z "$WIFI_INTERFACES" ]; then
          echo "No Wi-Fi interface detected"
        else
          for WIFI_INTERFACE in $WIFI_INTERFACES; do
            echo "--- Wi-Fi interface: ${WIFI_INTERFACE} ---"
            if iw dev "$WIFI_INTERFACE" link 2>/dev/null |
              grep -q '^Connected to'; then
              WIFI_CONNECTED=1
            fi
            iw dev "$WIFI_INTERFACE" link || true
          done

          if [ "$WIFI_CONNECTED" -eq 1 ]; then
            echo "RESULT: A Wi-Fi network is connected"
          else
            echo "RESULT: No connected Wi-Fi device detected"
          fi
        fi
      else
        echo "WARNING: Neither nmcli nor iw is available"
        echo "Wi-Fi status cannot be determined"
      fi

      echo "=== DNS Configuration ==="
      if [ -f /etc/resolv.conf ]; then
        cat /etc/resolv.conf
      else
        echo "WARNING: /etc/resolv.conf is not available"
      fi

      echo "=== Waiting for Network and GitHub DNS ==="

      NETWORK_READY=0
      NETWORK_WAIT_SECONDS=180
      NETWORK_INTERVAL_SECONDS=5
      NETWORK_ATTEMPTS=$((NETWORK_WAIT_SECONDS / NETWORK_INTERVAL_SECONDS))

      for attempt in $(seq 1 "$NETWORK_ATTEMPTS"); do
        echo "Network readiness check ${attempt}/${NETWORK_ATTEMPTS}"

        if ip route show default 2>/dev/null | grep -q '^default' &&
          getent hosts github.com >/dev/null 2>&1; then
          NETWORK_READY=1
          break
        fi

        sleep "$NETWORK_INTERVAL_SECONDS"
      done

      if [ "$NETWORK_READY" -ne 1 ]; then
        echo "ERROR: Network route or github.com DNS is unavailable after ${NETWORK_WAIT_SECONDS} seconds"
        echo "--- Interface addresses ---"
        ip addr || true
        echo "--- Routes ---"
        ip route || true
        echo "--- DNS lookup ---"
        getent hosts github.com || true
        exit 1
      fi

      echo "Network route and github.com DNS are ready"
      getent hosts github.com || true

    - |
      set -u

      echo "=== System Time Synchronization ==="
      echo "Current system time before synchronization:"
      date -u || true

      TIME_SYNC_CONFIRMED=0

      if command -v ntpdate >/dev/null 2>&1; then
        echo "Attempting time synchronization with ntpdate..."
        if ntpdate -u pool.ntp.org; then
          TIME_SYNC_CONFIRMED=1
          echo "Time synchronization succeeded with ntpdate"
        else
          echo "WARNING: ntpdate synchronization failed"
        fi
      fi

      if [ "$TIME_SYNC_CONFIRMED" -ne 1 ] &&
        command -v ntpd >/dev/null 2>&1; then
        echo "Attempting time synchronization with ntpd..."
        if ntpd -q -g; then
          TIME_SYNC_CONFIRMED=1
          echo "Time synchronization succeeded with ntpd"
        else
          echo "WARNING: ntpd synchronization failed"
        fi
      fi

      if [ "$TIME_SYNC_CONFIRMED" -ne 1 ] &&
        command -v timedatectl >/dev/null 2>&1; then
        echo "Enabling NTP with timedatectl..."
        if timedatectl set-ntp true; then
          echo "NTP enabled; waiting for synchronization status"
        else
          echo "WARNING: timedatectl could not enable NTP"
        fi

        for attempt in $(seq 1 12); do
          SYNC_STATUS="$(timedatectl show -p NTPSynchronized --value 2>/dev/null || true)"

          if [ "$SYNC_STATUS" = "yes" ]; then
            TIME_SYNC_CONFIRMED=1
            echo "timedatectl reports that the clock is synchronized"
            break
          fi

          echo "Clock is not yet synchronized (${attempt}/12)"
          sleep 5
        done
      fi

      echo "Current system time after synchronization attempts:"
      date -u || true

      CURRENT_YEAR="$(date -u +%Y 2>/dev/null || echo 0)"

      case "$CURRENT_YEAR" in
        ''|*[!0-9]*)
          CURRENT_YEAR=0
          ;;
      esac

      if [ "$TIME_SYNC_CONFIRMED" -eq 1 ]; then
        echo "System time synchronization was confirmed"
      elif [ "$CURRENT_YEAR" -ge 2025 ]; then
        echo "WARNING: Synchronization could not be confirmed, but the clock is not at the known-invalid 1980 epoch"
      else
        echo "ERROR: System clock is invalid or unsynchronized (year: ${CURRENT_YEAR})"
        echo "HTTPS Git operations are expected to fail with an invalid system clock."
        exit 1
      fi

    - |
      set -u

      echo "=== Environment and Network Diagnostics ==="

      echo "--- Hostname ---"
      hostname || true

      echo "--- Git version ---"
      if command -v git >/dev/null 2>&1; then
        git --version
      else
        echo "ERROR: git is not installed on the DUT"
        exit 1
      fi

      echo "--- Available network commands ---"
      command -v ip || true
      command -v nmcli || true
      command -v iw || true
      command -v getent || true

      echo "--- Network interfaces ---"
      ip link || true
      ip addr || true

      echo "--- Routes ---"
      ip route || true

      echo "--- GitHub DNS resolution ---"
      if getent hosts github.com; then
        echo "github.com DNS resolution succeeded"
      else
        echo "ERROR: github.com DNS resolution failed"
        exit 1
      fi

      echo "--- DNS configuration ---"
      if [ -f /etc/resolv.conf ]; then
        cat /etc/resolv.conf
      else
        echo "WARNING: /etc/resolv.conf is not available"
      fi

    - |
      set -u

      echo "=== Git Configuration ==="

      git config --global core.preloadindex true
      git config --global core.checkStat minimal
      git config --global fetch.fsckObjects false
      git config --global receive.fsckObjects false
      git config --global http.postBuffer 524288000
      git config --global core.compression 0

      echo "Git configuration applied"
      git config --global --list |
        grep -E 'core\.|http\.|fetch\.|receive\.' || true

    - |
      set -u

      echo "=== Repository Configuration ==="

      GITHUB_REPO_URL="https://github.com/Manigurr/qcom-linux-testkit.git"
      GITHUB_BRANCH="video-test-suite-import"
      GITHUB_CLONE_DIR="/opt/qcom-linux-testkit/video-test"

      echo "Repository URL: ${GITHUB_REPO_URL}"
      echo "Branch: ${GITHUB_BRANCH}"
      echo "Clone directory: ${GITHUB_CLONE_DIR}"

    - |
      set -u

      echo "=== Cloning qcom-linux-testkit Repository ==="

      GITHUB_REPO_URL="https://github.com/Manigurr/qcom-linux-testkit.git"
      GITHUB_BRANCH="video-test-suite-import"
      GITHUB_CLONE_DIR="/opt/qcom-linux-testkit/video-test"

      rm -rf "$GITHUB_CLONE_DIR"

      GITHUB_CLONE_SUCCESS=0

      for attempt in 1 2 3; do
        echo "qcom-linux-testkit clone attempt ${attempt}/3"

        if git clone \
          --depth 1 \
          --single-branch \
          --branch "$GITHUB_BRANCH" \
          "$GITHUB_REPO_URL" \
          "$GITHUB_CLONE_DIR"; then
          GITHUB_CLONE_SUCCESS=1
          break
        fi

        echo "Clone attempt ${attempt} failed"
        rm -rf "$GITHUB_CLONE_DIR"

        echo "--- Clone diagnostics ---"
        date -u || true
        getent hosts github.com || true
        ip route || true

        if [ "$attempt" -lt 3 ]; then
          sleep 5
        fi
      done

      if [ "$GITHUB_CLONE_SUCCESS" -ne 1 ]; then
        echo "ERROR: Failed to clone qcom-linux-testkit"
        exit 1
      fi

      echo "=== qcom-linux-testkit Clone Completed Successfully ==="

      echo "--- Repository contents ---"
      ls -la "$GITHUB_CLONE_DIR"

      echo "--- Repository branch ---"
      git -C "$GITHUB_CLONE_DIR" branch --show-current || true

      echo "--- Repository commit ---"
      git -C "$GITHUB_CLONE_DIR" log -1 --oneline || true

    - |
      set -u

      echo "=== Validating qcom-linux-testkit Repository ==="

      GITHUB_CLONE_DIR="/opt/qcom-linux-testkit/video-test"

      if [ ! -d "$GITHUB_CLONE_DIR" ]; then
        echo "ERROR: Clone directory does not exist: ${GITHUB_CLONE_DIR}"
        exit 1
      fi

      cd "$GITHUB_CLONE_DIR"

      echo "Current directory:"
      pwd

      echo "Repository files:"
      ls -la

      if [ ! -f "./run.sh" ]; then
        echo "ERROR: run.sh was not found in the repository root"
        exit 1
      fi

      chmod +x ./run.sh

      echo "run.sh permissions:"
      ls -l ./run.sh

    - |
      set -u

      echo "=== Starting Video Test Suite ==="
      echo "Timestamp: $(date -u)"

      GITHUB_CLONE_DIR="/opt/qcom-linux-testkit/video-test"
      RESULTS_LOG="/opt/qcom-linux-testkit/video-test-suite-results.log"

      cd "$GITHUB_CLONE_DIR"

      echo "Executing: ./run.sh iris_v4l2_test"

      ./run.sh iris_v4l2_test >"$RESULTS_LOG" 2>&1
      RUN_STATUS=$?

      cat "$RESULTS_LOG"

      echo "run.sh exit status: ${RUN_STATUS}"

      if [ "$RUN_STATUS" -ne 0 ]; then
        echo "ERROR: Video test suite failed"
        exit "$RUN_STATUS"
      fi

      echo "=== Video Test Suite Completed Successfully ==="
      echo "Timestamp: $(date -u)"

    - |
      set -u

      echo "=== Test Results Summary ==="

      RESULTS_LOG="/opt/qcom-linux-testkit/video-test-suite-results.log"
      RESULTS_DIR="/data/test-results"

      if [ ! -f "$RESULTS_LOG" ]; then
        echo "WARNING: Test result log was not generated"
        exit 0
      fi

      echo "=== Full Test Output ==="
      cat "$RESULTS_LOG"

      if ! mkdir -p "$RESULTS_DIR" 2>/dev/null; then
        RESULTS_DIR="/opt/qcom-linux-testkit/test-results"
        if ! mkdir -p "$RESULTS_DIR"; then
          echo "ERROR: Could not create a results directory"
          exit 1
        fi
      fi

      RESULT_FILE="${RESULTS_DIR}/video-test-suite-results-$(date +%s).log"

      if ! cp "$RESULTS_LOG" "$RESULT_FILE"; then
        echo "ERROR: Could not copy the results log to ${RESULT_FILE}"
        exit 1
      fi

      echo "Results saved to:"
      echo "$RESULT_FILE"

    - |
      set -u

      echo "=== Final Status Report ==="

      echo "Git version:"
      git --version || true

      echo "Main repository:"
      echo "  URL: https://github.com/Manigurr/qcom-linux-testkit.git"
      echo "  Branch: video-test-suite-import"
      echo "  Directory: /opt/qcom-linux-testkit/video-test"

      echo "Test execution time:"
      date -u || true

      echo "=== Test Execution Complete ==="
