metadata:
  format: Lava-Test Test Definition 1.0
  name: Video_Test_Suite_Import
  description: "Wait for network readiness, clone the video-test-suite-import branch from qcom-linux-testkit, and run the test suite with ./run.sh"
  maintainer:
    - manigurr@qti.qualcomm.com
  os:
    - openembedded
  scope:
    - functional

run:
  steps:
    - cd /tmp

    - |
      set -u

      REPO_URL="https://github.com/Manigurr/qcom-linux-testkit.git"
      BRANCH="video-test-suite-import"
      CLONE_DIR="/tmp/qcom-linux-testkit-video-test"

      echo "=== Starting Environment Validation ==="

      if ! command -v git >/dev/null 2>&1; then
        echo "ERROR: git is not installed on the DUT"
        exit 1
      fi

      echo "git version:"
      git --version

      echo "=== Network Interfaces ==="
      if command -v ip >/dev/null 2>&1; then
        ip link || true
        ip addr || true
        ip route || true
      else
        echo "WARNING: ip command is not available"
      fi

      echo "=== DNS Configuration ==="
      if [ -f /etc/resolv.conf ]; then
        cat /etc/resolv.conf
      else
        echo "WARNING: /etc/resolv.conf does not exist"
      fi

      echo "=== Waiting for Network and DNS Readiness ==="

      NETWORK_READY=0

      for retry in $(seq 1 60); do
        echo "Network readiness attempt ${retry}/60"

        DNS_READY=0

        if command -v getent >/dev/null 2>&1; then
          if getent hosts github.com >/dev/null 2>&1; then
            DNS_READY=1
          fi
        elif command -v nslookup >/dev/null 2>&1; then
          if nslookup github.com >/dev/null 2>&1; then
            DNS_READY=1
          fi
        elif command -v ping >/dev/null 2>&1; then
          if ping -c 1 -W 5 github.com >/dev/null 2>&1; then
            DNS_READY=1
          fi
        else
          echo "WARNING: No DNS utility is available"
        fi

        if [ "$DNS_READY" -eq 1 ]; then
          echo "DNS resolution for github.com is available"
          NETWORK_READY=1
          break
        fi

        echo "DNS is not ready; waiting 2 seconds"
        sleep 2
      done

      if [ "$NETWORK_READY" -ne 1 ]; then
        echo "ERROR: DNS resolution for github.com did not become ready"

        echo "=== Final Network Diagnostics ==="
        if command -v ip >/dev/null 2>&1; then
          ip addr || true
          ip route || true
        fi

        if [ -f /etc/resolv.conf ]; then
          cat /etc/resolv.conf
        fi

        exit 1
      fi

      echo "=== Checking HTTPS Connectivity ==="

      HTTPS_READY=0

      for retry in $(seq 1 30); do
        echo "HTTPS connectivity attempt ${retry}/30"

        if command -v curl >/dev/null 2>&1; then
          if curl -kIsS --connect-timeout 10 \
              --max-time 20 \
              https://github.com >/dev/null 2>&1; then
            HTTPS_READY=1
            break
          fi
        elif command -v wget >/dev/null 2>&1; then
          if wget --spider \
              --timeout=10 \
              https://github.com >/dev/null 2>&1; then
            HTTPS_READY=1
            break
          fi
        else
          echo "WARNING: curl and wget are not available"
          echo "Skipping explicit HTTPS connectivity check"
          HTTPS_READY=1
          break
        fi

        echo "HTTPS connectivity is not ready; waiting 2 seconds"
        sleep 2
      done

      if [ "$HTTPS_READY" -ne 1 ]; then
        echo "ERROR: HTTPS connectivity to github.com is unavailable"
        exit 1
      fi

      echo "=== Network Validation Completed Successfully ==="

    - |
      set -u

      REPO_URL="https://github.com/Manigurr/qcom-linux-testkit.git"
      BRANCH="video-test-suite-import"
      CLONE_DIR="/tmp/qcom-linux-testkit-video-test"

      echo "=== Starting Repository Clone ==="
      echo "Repository: $REPO_URL"
      echo "Branch: $BRANCH"
      echo "Clone directory: $CLONE_DIR"

      if [ -d "$CLONE_DIR" ]; then
        echo "Removing existing clone directory: $CLONE_DIR"
        rm -rf "$CLONE_DIR"
      fi

      CLONE_SUCCESS=0

      for retry in $(seq 1 3); do
        echo "Repository clone attempt ${retry}/3"

        rm -rf "$CLONE_DIR"

        if git clone \
          --depth 1 \
          --single-branch \
          --branch "$BRANCH" \
          "$REPO_URL" \
          "$CLONE_DIR"; then
          CLONE_SUCCESS=1
          break
        fi

        echo "WARNING: Repository clone attempt ${retry} failed"

        if [ "$retry" -lt 3 ]; then
          echo "Waiting 5 seconds before retrying"
          sleep 5
        fi
      done

      if [ "$CLONE_SUCCESS" -ne 1 ]; then
        echo "ERROR: Failed to clone repository after 3 attempts"
        exit 1
      fi

      if [ ! -d "$CLONE_DIR/.git" ]; then
        echo "ERROR: Clone directory does not contain a valid Git repository"
        exit 1
      fi

      echo "=== Repository Clone Completed Successfully ==="

      cd "$CLONE_DIR"

      echo "=== Repository Information ==="
      git remote -v || true
      git branch --show-current || true
      git log -1 --oneline || true

    - |
      set -u

      CLONE_DIR="/tmp/qcom-linux-testkit-video-test"

      cd "$CLONE_DIR" || {
        echo "ERROR: Failed to navigate to clone directory"
        exit 1
      }

      echo "=== Current Directory ==="
      pwd

      echo "=== Repository Contents ==="
      ls -la

      if [ ! -f "./run.sh" ]; then
        echo "ERROR: run.sh was not found in the repository root"
        exit 1
      fi

      chmod +x ./run.sh

      if [ ! -x "./run.sh" ]; then
        echo "ERROR: run.sh is not executable"
        exit 1
      fi

      echo "run.sh validation completed successfully"

    - |
      set -u

      CLONE_DIR="/tmp/qcom-linux-testkit-video-test"
      RESULTS_LOG="/tmp/video-test-suite-results.log"
      EXIT_CODE_FILE="/tmp/video-test-suite-exit-code"

      cd "$CLONE_DIR" || {
        echo "ERROR: Failed to navigate to clone directory"
        echo "1" > "$EXIT_CODE_FILE"
        exit 1
      }

      rm -f "$RESULTS_LOG"
      rm -f "$EXIT_CODE_FILE"

      echo "=== Starting Test Suite Execution ==="
      echo "Timestamp: $(date)"
      echo "Working directory: $(pwd)"

      echo "=== Executing ./run.sh ==="

      set +e

      if command -v timeout >/dev/null 2>&1; then
        timeout --signal=TERM --kill-after=30s 15m \
          ./run.sh 2>&1 | tee "$RESULTS_LOG"
        RUN_STATUS=${PIPESTATUS[0]}
      else
        echo "WARNING: timeout command is unavailable"
        ./run.sh 2>&1 | tee "$RESULTS_LOG"
        RUN_STATUS=${PIPESTATUS[0]}
      fi

      set -e

      echo "$RUN_STATUS" > "$EXIT_CODE_FILE"

      echo "=== Test Suite Execution Completed ==="
      echo "Test suite exit code: $RUN_STATUS"
      echo "Timestamp: $(date)"

      if [ "$RUN_STATUS" -eq 0 ]; then
        echo "Test suite completed successfully"
      elif [ "$RUN_STATUS" -eq 124 ]; then
        echo "ERROR: Test suite timed out"
      else
        echo "WARNING: Test suite exited with non-zero status"
      fi

      # Do not exit here. The following step archives the results first.

    - |
      set -u

      RESULTS_LOG="/tmp/video-test-suite-results.log"
      RESULTS_DIR="/data/test-results"
      FALLBACK_RESULTS_DIR="/tmp/test-results"
      EXIT_CODE_FILE="/tmp/video-test-suite-exit-code"

      echo "=== Test Results Summary ==="

      if [ -f "$RESULTS_LOG" ]; then
        echo "=== Full Test Output ==="
        cat "$RESULTS_LOG"
      else
        echo "WARNING: No test results log was found"
      fi

      if mkdir -p "$RESULTS_DIR" 2>/dev/null; then
        FINAL_RESULTS_DIR="$RESULTS_DIR"
      else
        echo "WARNING: Unable to write to $RESULTS_DIR"
        FINAL_RESULTS_DIR="$FALLBACK_RESULTS_DIR"
        mkdir -p "$FINAL_RESULTS_DIR"
      fi

      RESULTS_FILE="$FINAL_RESULTS_DIR/video-test-suite-results-$(date +%s).log"

      if [ -f "$RESULTS_LOG" ]; then
        cp "$RESULTS_LOG" "$RESULTS_FILE"
        echo "Results saved to: $RESULTS_FILE"
      else
        echo "No result log was available to copy" > "$RESULTS_FILE"
        echo "Results status saved to: $RESULTS_FILE"
      fi

      if [ -f "$EXIT_CODE_FILE" ]; then
        TEST_EXIT_CODE="$(cat "$EXIT_CODE_FILE")"
      else
        echo "WARNING: Test exit code file was not found"
        TEST_EXIT_CODE=1
      fi

      echo "Recorded test suite exit code: $TEST_EXIT_CODE"

    - |
      set -u

      REPO_URL="https://github.com/Manigurr/qcom-linux-testkit.git"
      BRANCH="video-test-suite-import"
      CLONE_DIR="/tmp/qcom-linux-testkit-video-test"
      EXIT_CODE_FILE="/tmp/video-test-suite-exit-code"

      echo "=== Final Status Report ==="
      echo "Repository: $REPO_URL"
      echo "Branch: $BRANCH"
      echo "Clone Directory: $CLONE_DIR"
      echo "Test Execution Time: $(date)"

      if [ -f "$EXIT_CODE_FILE" ]; then
        TEST_EXIT_CODE="$(cat "$EXIT_CODE_FILE")"
      else
        TEST_EXIT_CODE=1
      fi

      echo "Test Suite Exit Code: $TEST_EXIT_CODE"

      if [ "$TEST_EXIT_CODE" -eq 0 ]; then
        echo "=== Test Execution Completed Successfully ==="
        exit 0
      fi

      echo "=== Test Execution Failed ==="
      exit "$TEST_EXIT_CODE"
